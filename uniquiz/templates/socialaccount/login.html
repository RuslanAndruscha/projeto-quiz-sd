<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar com Google - UniQuiz</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --blue: #1982c4;
            --purple: #6a4c93;
            --red: #ff595e;
            --text: #2d3142;
            --white: #fff;
        }

        * {
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            display: grid;
            place-items: center;
            color: var(--text);
            background: linear-gradient(
                135deg,
                rgba(25, 130, 196, 0.08),
                rgba(138, 201, 38, 0.08)
            );
        }

        .card {
            width: 100%;
            max-width: 440px;
            padding: 2.5rem;
            text-align: center;
            background: var(--white);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .logo {
            display: inline-block;
            margin-bottom: 1.5rem;
            color: var(--purple);
            font-size: 2rem;
            font-weight: 700;
            text-decoration: none;
        }

        .logo span {
            color: var(--red);
        }

        h1 {
            margin: 0 0 0.75rem;
            font-size: 1.5rem;
        }

        p {
            margin: 0 0 1.75rem;
            color: #555;
            line-height: 1.6;
        }

        .continue-button {
            width: 100%;
            padding: 0.9rem 1rem;
            border: 0;
            border-radius: 10px;
            color: var(--white);
            background: var(--blue);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .continue-button:hover {
            background: var(--purple);
            transform: translateY(-2px);
        }

        .back-link {
            display: inline-block;
            margin-top: 1.25rem;
            color: var(--blue);
            text-decoration: none;
        }

        .back-link:hover {
            color: var(--purple);
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <main class="card">
        <a class="logo" href="{% url 'uniquiz:home' %}">Uni<span>Quiz</span></a>

        <h1>Entrar com Google</h1>

        {% if process == "connect" %}
            <p>Continue para conectar sua conta {{ provider.name }} ao UniQuiz.</p>
        {% else %}
            <p>Você será redirecionado ao Google para entrar no UniQuiz com sua conta.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <button class="continue-button" type="submit">
                Continuar para o Google
            </button>
        </form>

        <a class="back-link" href="{% url 'uniquiz:login' %}">
            Voltar ao login
        </a>
    </main>
</body>
</html>
