<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - UniQuiz</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Variáveis de Cores da Identidade Visual */
        :root {
            --red: #ff595e;
            --yellow: #ffca3a;
            --green: #8ac926;
            --blue: #1982c4;
            --purple: #6a4c93;
            
            --bg-light: #f9f9fc;
            --text-dark: #2d3142;
            --white: #ffffff;
        }

        /* Reset Global */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        /* Fundo em tela cheia com gradiente suave */
        body {
            background: linear-gradient(135deg, rgba(25, 130, 196, 0.08) 0%, rgba(138, 201, 38, 0.08) 100%);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Card Central do Login */
        .login-wrapper {
            background-color: var(--white);
            padding: 3.5rem 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .logo {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--purple);
            text-decoration: none;
            display: inline-block;
            margin-bottom: 0.5rem;
        }

        .logo span {
            color: var(--red);
        }

        .login-subtitle {
            color: #555;
            margin-bottom: 2.5rem;
            font-size: 1rem;
        }

        /* Estrutura do Formulário */
        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #555;
            font-size: 0.95rem;
        }

        .form-group input {
            width: 100%;
            padding: 1rem;
            border: 2px solid #e1e1e1;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(25, 130, 196, 0.2);
        }

        /* Mensagens de Erro do Django */
        .error-message {
            background-color: rgba(255, 89, 94, 0.1);
            color: var(--red);
            padding: 0.8rem;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            font-weight: 600;
            text-align: center;
        }

        /* Botão de Envio */
        .btn-submit {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--white);
            background-color: var(--blue);
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .btn-submit:hover {
            background-color: var(--purple);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(106, 76, 147, 0.3);
        }

        /* Link para Cadastro */
        .register-link {
            display: inline-block;
            margin-top: 2rem;
            font-size: 0.95rem;
            color: #555;
            text-decoration: none;
        }

        .register-link span {
            color: var(--blue);
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .register-link:hover span {
            color: var(--purple);
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <a href="{% url 'uniquiz:home' %}" class="logo">Uni<span>Quiz</span></a>
        <p class="login-subtitle">Acesse sua conta para continuar a jornada</p>
        
        <form action="{% url 'uniquiz:login' %}" method="POST">{% csrf_token %}
            
            <!-- Renderização de possíveis mensagens de erro (ex: credenciais inválidas) -->
            {% if messages %}
                <div class="error-message">
                    {% for message in messages %}
                        {{ message }}
                    {% endfor %}
                </div>
            {% endif %}

            <div class="form-group">
                <label for="email">E-mail Acadêmico</label>
                <!-- O name='username' é padrão no Django Auth, mesmo pedindo um e-mail visualmente -->
                <input type="email" id="email" name="username" placeholder="seu.nome@universidade.edu.br" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="password" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn-submit">Entrar na Plataforma</button>
        </form>

        <a href="{% url 'uniquiz:cadastro' %}" class="register-link">
            Ainda não tem conta? <span>Cadastre-se aqui</span>
        </a>
    </div>

</body>
</html>
